<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24040a"/>
      <stop offset="0.52" stop-color="#130208"/>
      <stop offset="1" stop-color="#090108"/>
    </linearGradient>

    <radialGradient id="glow" cx="45%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#b30f2f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="78%" cy="22%" r="62%">
      <stop offset="0" stop-color="#ffb14a" stop-opacity="0.14"/>
      <stop offset="0.48" stop-color="#ff5a1f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Blocky basalt / netherrack pattern -->
    <pattern id="blocks" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="#000000" fill-opacity="0.10"/>
      <path d="M0 0H96V96H0Z" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
      <path d="M0 48H96M48 0V96" stroke="#000000" stroke-opacity="0.16" stroke-width="2"/>
      <path d="M10 14h30v18H10zM54 10h32v22H54zM16 58h28v30H16zM56 60h26v26H56z" fill="#ff5a1f" fill-opacity="0.05"/>
      <path d="M22 24h8v6h-8zM66 18h8v6h-8zM26 78h8v6h-8zM74 72h8v6h-8z" fill="#ffb14a" fill-opacity="0.06"/>
    </pattern>

    <!-- Lava shimmer stripes -->
    <linearGradient id="lava" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff2a00" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffb14a" stop-opacity="0.90"/>
    </linearGradient>

    <pattern id="lavaGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="url(#lava)"/>
      <path d="M0 0H64V64H0Z" fill="none" stroke="#000000" stroke-opacity="0.20" stroke-width="2"/>
      <path d="M0 32H64M32 0V64" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M10 12h10v8H10zM40 16h14v10H40zM16 42h12v12H16zM40 40h10v14H40z" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Distant fog blocks -->
  <rect width="1920" height="1080" fill="url(#blocks)" opacity="0.9"/>

  <!-- Basalt silhouettes -->
  <g fill="#02010a" fill-opacity="0.62">
    <rect x="120" y="520" width="120" height="560"/>
    <rect x="220" y="460" width="160" height="620"/>
    <rect x="420" y="540" width="140" height="540"/>
    <rect x="560" y="480" width="210" height="600"/>
    <rect x="860" y="510" width="180" height="570"/>
    <rect x="1040" y="470" width="240" height="610"/>
    <rect x="1340" y="560" width="210" height="520"/>
    <rect x="1540" y="500" width="260" height="580"/>
  </g>

  <!-- Lava sea at bottom -->
  <rect y="820" width="1920" height="260" fill="url(#lavaGrid)" opacity="0.95"/>
  <rect y="808" width="1920" height="18" fill="#ffb14a" fill-opacity="0.10"/>

  <!-- Heat vignette -->
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.12"/>
</svg>
